<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio – Website Styles</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      @property --glow {
        syntax: "<color>";
        inherits: true;
        initial-value: #1b1030;
      }
      @property --bg {
        syntax: "<color>";
        inherits: true;
        initial-value: #05060c;
      }
      @property --ink {
        syntax: "<color>";
        inherits: true;
        initial-value: #f4f1ff;
      }
      @property --mute {
        syntax: "<color>";
        inherits: true;
        initial-value: rgba(244, 241, 255, 0.62);
      }
      @property --acc {
        syntax: "<color>";
        inherits: true;
        initial-value: #ffffff;
      }
      :root {
        color-scheme: dark;
        --glow: #1b1030;
        --bg: #05060c;
        --acc: #fff;
        --ink: #f4f1ff;
        --mute: rgba(244, 241, 255, 0.62);
        --tilt: 13deg;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        transition:
          --glow 1.1s ease,
          --bg 1.1s ease,
          --acc 1.1s ease,
          --ink 1.1s ease,
          --mute 1.1s ease;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 50% 48%, var(--glow) 0%, transparent 62%),
          var(--bg);
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      .app {
        position: relative;
        z-index: 2;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 18px clamp(16px, 4vw, 48px) 20px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      header b {
        font-weight: 600;
      }
      .count {
        color: var(--mute);
        font-variant-numeric: tabular-nums;
      }
      .scene {
        --persp: 1600px;
        position: relative;
        min-height: 0;
        display: grid;
        place-items: center;
        perspective: var(--persp);
        cursor: grab;
      }
      .scene:active {
        cursor: grabbing;
      }
      .world {
        position: relative;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        transform: rotateX(calc(var(--tilt) * -1 + var(--rx, 0deg)));
        transition: transform 0.35s ease-out;
      }
      .heroHolder {
        position: absolute;
        left: calc(var(--hw) / -2);
        top: calc(var(--hh) / -2 + var(--hy, 0px));
        width: var(--hw);
        height: var(--hh);
        transform: rotateX(calc(var(--tilt) - var(--rx, 0deg)));
        transition: transform 0.35s ease-out;
      }
      .hero {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(0.6);
        transition:
          transform 0.8s var(--ease),
          opacity 0.6s ease;
        pointer-events: none;
      }
      .hero.on {
        opacity: 1;
        transform: none;
        pointer-events: auto;
        cursor: pointer;
      }
      .float {
        position: absolute;
        inset: 0;
        animation: float 7s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-12px);
        }
      }
      .float > img:not(.cut) {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: calc(var(--hw) * 0.05);
        border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
        box-shadow:
          0 0 calc(var(--hw) * 0.18) var(--glow2),
          0 24px 50px rgb(0 0 0 / var(--shade, 0.5));
      }
      .cut {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--sw);
        height: var(--sh);
        object-fit: contain;
        object-position: 50% 100%;
        cursor: pointer;
        transform: translate(
          calc(-50% + var(--ox, 4%)),
          calc(-50% + var(--oy, -2%))
        );
        filter: drop-shadow(0 14px 28px rgb(0 0 0 / var(--shade, 0.45)));
        -webkit-mask-image:
          linear-gradient(to bottom, #000 78%, transparent),
          linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to bottom, #000 78%, transparent),
          linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
        mask-composite: intersect;
      }
      .stage {
        position: absolute;
        left: 50%;
        top: 50%;
        height: var(--sh);
        aspect-ratio: 1152/928;
        transform: translate(-41%, -53%);
        pointer-events: none;
        -webkit-mask-image:
          linear-gradient(to bottom, #000 76%, transparent),
          linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to bottom, #000 76%, transparent),
          linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
        mask-composite: intersect;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .stage .model {
        position: absolute;
        left: 23.177%;
        top: 0.862%;
        width: 56.163%;
        height: 99.138%;
        pointer-events: auto;
        cursor: pointer;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.45));
      }
      .cutw {
        position: absolute;
        left: 50%;
        top: 50%;
        height: calc(var(--sh) * 0.92);
        aspect-ratio: var(--ar);
        transform: translate(
          calc(-50% + var(--ox, 4%)),
          calc(-50% + var(--oy, -2%))
        );
        cursor: pointer;
      }
      .cutw > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .nb {
        -webkit-mask-image:
          linear-gradient(
            to right,
            transparent,
            #000 7%,
            #000 60%,
            transparent 98%
          ),
          linear-gradient(
            to bottom,
            transparent,
            #000 8%,
            #000 74%,
            transparent
          );
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(
            to right,
            transparent,
            #000 7%,
            #000 60%,
            transparent 98%
          ),
          linear-gradient(
            to bottom,
            transparent,
            #000 8%,
            #000 74%,
            transparent
          );
        mask-composite: intersect;
      }
      .nbl {
        filter: blur(12px);
        -webkit-mask-image:
          linear-gradient(
            to right,
            transparent 48%,
            #000 72%,
            transparent 100%
          ),
          linear-gradient(
            to bottom,
            transparent,
            #000 8%,
            #000 74%,
            transparent
          );
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(
            to right,
            transparent 48%,
            #000 72%,
            transparent 100%
          ),
          linear-gradient(
            to bottom,
            transparent,
            #000 8%,
            #000 74%,
            transparent
          );
        mask-composite: intersect;
      }
      .gold {
        position: absolute;
        left: 28%;
        right: -80%;
        top: -4%;
        bottom: 6%;
        pointer-events: none;
        mix-blend-mode: screen;
        background:
          radial-gradient(
            ellipse 34% 44% at 40% 36%,
            rgba(255, 204, 106, 0.62),
            rgba(255, 166, 40, 0.2) 55%,
            transparent 78%
          ),
          radial-gradient(
            ellipse 30% 36% at 58% 74%,
            rgba(255, 190, 80, 0.3),
            transparent 72%
          );
        animation: goldP 7s ease-in-out infinite alternate;
      }
      @keyframes goldP {
        from {
          opacity: 0.6;
          transform: translateX(-6px) scale(1);
        }
        to {
          opacity: 1;
          transform: translateX(12px) scale(1.04);
        }
      }
      .glint {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        background: linear-gradient(
            105deg,
            transparent 42%,
            rgba(255, 232, 170, 0.3) 50%,
            transparent 58%
          )
          130% 0/260% 100% no-repeat;
        -webkit-mask-image: linear-gradient(
          to right,
          #000 55%,
          transparent 98%
        );
        mask-image: linear-gradient(to right, #000 55%, transparent 98%);
        animation: gl 8s ease-in-out infinite;
      }
      @keyframes gl {
        0%,
        50% {
          background-position: 130% 0;
        }
        100% {
          background-position: -30% 0;
        }
      }
      .info h1.gold2 {
        background: linear-gradient(180deg, #fff2c8, #e6b650 55%, #a8741f);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* Studio: the office scene, every piece of the illustration animated */
      .float.still {
        animation: none;
      }
      .chs {
        position: absolute;
        left: 50%;
        top: 50%;
        height: var(
          --ssh,
          min(var(--sh), calc(var(--sw) * 0.7467 * var(--ms, 1)))
        );
        aspect-ratio: 1200/896;
        transform: translate(
          calc(-50% + var(--ox, 2%)),
          calc(-50% + var(--oy, -2%) + var(--ssy, 0px))
        );
        pointer-events: none;
        -webkit-mask-image: linear-gradient(
          to right,
          transparent,
          #000 3%,
          #000 97%,
          transparent
        );
        mask-image: linear-gradient(
          to right,
          transparent,
          #000 3%,
          #000 97%,
          transparent
        );
      }
      .pm .chs {
        --ox: 0% !important;
        --oy: 0% !important;
      }
      .chs .ch {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: auto;
        cursor: pointer;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.35));
      }
      .chs img {
        position: absolute;
        display: block;
      }
      .chs .bk {
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1s ease;
      }
      .hero.on .bk {
        opacity: 1;
      }
      .chs .e {
        position: absolute;
        opacity: 0;
        transform: translateY(18px) scale(0.94);
        transition:
          opacity 0.9s ease var(--d),
          transform 1s var(--ease) var(--d);
      }
      .hero.on .e {
        opacity: 1;
        transform: none;
      }
      .chs .e img {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .chs .w {
        left: 33.58%;
        top: 14.84%;
        width: 36.25%;
        height: 80.8%;
        pointer-events: auto;
        cursor: pointer;
        filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.4));
      }
      .fl {
        animation: chF 6s ease-in-out infinite alternate;
        animation-delay: var(--ad);
      }
      @keyframes chF {
        from {
          transform: translateY(-5px) rotate(-0.4deg);
        }
        to {
          transform: translateY(6px) rotate(0.4deg);
        }
      }
      .spin {
        animation: chS 45s linear infinite;
      }
      .spinr {
        animation: chS 32s linear infinite reverse;
      }
      @keyframes chS {
        to {
          transform: rotate(360deg);
        }
      }
      .pulse {
        animation: chP 4.5s ease-in-out infinite alternate;
      }
      @keyframes chP {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.07);
        }
      }
      .drift {
        animation: chD 16s ease-in-out infinite alternate;
      }
      @keyframes chD {
        from {
          transform: translateX(-14px);
        }
        to {
          transform: translateX(16px);
        }
      }
      .twk {
        animation: chT 5s ease-in-out infinite alternate;
        animation-delay: var(--ad);
      }
      @keyframes chT {
        from {
          opacity: 0.5;
        }
        to {
          opacity: 1;
        }
      }
      .sway {
        transform-origin: 50% 100%;
        animation: chW 8s ease-in-out infinite alternate;
        animation-delay: var(--ad);
      }
      @keyframes chW {
        from {
          transform: rotate(-0.8deg);
        }
        to {
          transform: rotate(0.8deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fl,
        .spin,
        .spinr,
        .pulse,
        .drift,
        .twk,
        .sway,
        .gold,
        .glint {
          animation: none;
        }
      }
      .pm .info {
        min-height: 100px;
      }
      .pm .info h1 {
        font-size: clamp(24px, 8vw, 34px);
      }
      .pm .info p {
        margin: 4px 0 10px;
      }
      @media (max-height: 520px) {
        .app {
          padding: 8px clamp(12px, 3vw, 32px) 8px;
        }
        header {
          font-size: 11px;
        }
        .info {
          min-height: 0;
        }
        .info h1 {
          font-size: 20px;
        }
        .info p {
          display: none;
        }
        .visit {
          padding: 6px 16px;
          font-size: 10px;
          margin-top: 6px;
        }
      }
      .orbit {
        position: absolute;
        left: calc(var(--cw) / -2);
        top: calc(var(--ch) / -2 - var(--oy, 0px));
        width: var(--cw);
        height: var(--ch);
        transform-style: preserve-3d;
        transition: transform 1s var(--ease);
      }
      .card {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        cursor: pointer;
        outline: none;
      }
      .flip {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: calc(var(--cw) * 0.12);
        border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
        overflow: hidden;
        opacity: 0.72;
        background: linear-gradient(170deg, var(--glow2), #0a0c16 88%);
        box-shadow: 0 14px 30px rgb(0 0 0 / var(--shade, 0.45));
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transition:
          scale 0.6s var(--ease),
          opacity 0.6s,
          border-color 0.6s,
          box-shadow 0.6s;
      }
      .face.back {
        transform: rotateY(180deg);
      }
      .face::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.7),
          transparent 40%
        );
        pointer-events: none;
      }
      .card.on .face {
        scale: var(--act, 0.88);
        opacity: 1;
        border-color: var(--acc);
        box-shadow:
          0 0 44px var(--glow2),
          0 14px 30px rgb(0 0 0 / var(--shade, 0.5));
      }
      .card:focus-visible .face {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      .face img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .lbl,
      .num {
        z-index: 1;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      .lbl {
        color: #fff;
        transition: opacity 0.4s;
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(var(--cw) * 0.07);
        text-align: center;
        font-size: clamp(10px, calc(var(--cw) * 0.075), 15px);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .num {
        position: absolute;
        left: calc(var(--cw) * 0.08);
        top: calc(var(--cw) * 0.06);
        font-size: clamp(10px, calc(var(--cw) * 0.065), 13px);
        color: #fff;
      }
      footer {
        display: block;
        position: relative;
        z-index: 3;
      }
      .info {
        text-align: center;
        min-height: 118px;
        transition: opacity 0.3s;
      }
      .info.swap {
        opacity: 0;
      }
      .info h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 42px);
        font-weight: var(--fw, 300);
        letter-spacing: var(--ls, 0.14em);
        text-transform: var(--tt, uppercase);
        font-family: var(--font, inherit);
      }
      .info p {
        margin: 6px 0 12px;
        color: var(--mute);
        font-size: clamp(13px, 2vw, 16px);
      }
      .visit {
        display: inline-block;
        padding: 9px 22px;
        border: 1px solid var(--acc);
        border-radius: 999px;
        color: var(--acc);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition:
          background 0.25s,
          color 0.25s;
      }
      .visit:hover,
      .visit:focus-visible {
        background: var(--acc);
        color: var(--bg);
        outline: none;
      }
      .nav {
        position: absolute;
        top: var(--ny, 42%);
        margin-top: -23px;
        z-index: 5;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
        background: color-mix(in srgb, var(--ink) 7%, transparent);
        color: var(--ink);
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }
      #prev {
        left: max(4px, calc(50% - var(--r) - 110px));
      }
      #next {
        right: max(4px, calc(50% - var(--r) - 110px));
      }
      .nav:hover {
        background: color-mix(in srgb, var(--ink) 18%, transparent);
      }
      .nav:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      @media (max-width: 520px) {
        .nav {
          width: 40px;
          height: 40px;
          margin-top: -20px;
          font-size: 17px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .float {
          animation: none;
        }
        .orbit,
        .face,
        .hero {
          transition-duration: 0.01s;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <canvas id="fx"></canvas>
    <div class="app">
      <header>
        <b>Portfolio</b><span class="count" id="count">01 / 07</span>
      </header>
      <div class="scene" id="scene">
        <div class="world" id="world">
          <div class="heroHolder" id="heroHolder"></div>
          <div class="orbit" id="orbit"></div>
        </div>
        <button class="nav" id="prev" aria-label="Previous">&#8592;</button>
        <button class="nav" id="next" aria-label="Next">&#8594;</button>
      </div>
      <footer>
        <div class="info" id="info">
          <h1 id="title"></h1>
          <p id="tag"></p>
          <a class="visit" id="visit" target="_blank" rel="noopener"
            >View websites</a
          >
        </div>
      </footer>
    </div>
    <script>
      /* EDIT ME: one item = one card + its page theme.
   img  = the card / centre image      href = the sub-site (opens in a new tab)
   bg/glow/acc = page colours          fx   = floating animation (spark, confetti, neon, petal, blob, orb, square)
   font/fw/ls/tt = title typography    pos  = which part of the image stays visible when cropped */
      /* Studio: the whole office illustration is one image (images/studio/chic.webp, converted from chic.svg, 1200x896) */
      function sceneHTML(it) {
        return (
          '<div class="chs" style="--ox:' +
          it.off[0] +
          ";--oy:" +
          it.off[1] +
          '"><img class="ch" alt="" data-alt="' +
          it.name +
          '" data-src="' +
          it.hero +
          '"></div>'
        );
      }
      const items = [
        {
          name: "Spectrum",
          tag: "Vibrant gradients and summer energy",
          href: "https://rachana-code-prog.github.io/Marvellous-Beauty-parlour-official/",
          hero: "images/hero/spectrum.webp",
          img: "images/hero/thumb/spectrum.webp",
          pos: "50% 22%",
          bg: "#0a1226",
          glow: "#0d5a85",
          acc: "#ffb020",
          fx: "orb",
          font: "system-ui,sans-serif",
          fw: 600,
          ls: ".14em",
          tt: "uppercase",
        },
        {
          name: "Noir Luxe",
          shine: true,
          ar: "849/1264",
          off: ["2%", "-1%"],
          goldTitle: true,
          tag: "Dark, elegant, gold-accented brands",
          href: "https://rachana-code-prog.github.io/Marvellous-Beauty-parlour-official/",
          hero: "images/hero/noir.webp",
          img: "images/hero/thumb/noir.webp",
          pos: "50% 18%",
          bg: "#050507",
          glow: "#5c430f",
          acc: "#e8c25a",
          fx: "spark",
          font: "Georgia,'Times New Roman',serif",
          fw: 400,
          ls: ".14em",
          tt: "uppercase",
        },
        {
          name: "Playful",
          tag: "Bright, bubbly, full of motion",
          href: "https://rachana-code-prog.github.io/Marvellous-Beauty-parlour-official/",
          hero: "images/hero/playful.webp",
          img: "images/hero/thumb/playful.webp",
          pos: "50% 40%",
          bg: "#fffaf2",
          glow: "#ffd29a",
          g2: "#ff9a2e",
          acc: "#ff2e93",
          ink: "#2b1a4a",
          mute: "rgba(43,26,74,.62)",
          shade: 0.2,
          fx: "play",
          font: "'Trebuchet MS',system-ui,sans-serif",
          fw: 700,
          ls: ".05em",
          tt: "none",
        },
        {

              })),
              dp:
                Math.random() < 0.65
                  ? {
                      x: rnd(-0.4, 0.4) * R,
                      l: R * rnd(0.8, 2.2),
                      w: R * rnd(0.08, 0.15),
                    }
                  : null,
            };
          },
          dr(p) {
            const age = p.age - p.delay;
            if (age <= 0) return;
            const a = Math.min(1, age / p.dur),
              e = a < 1 ? eob(a) : 1,
              b = eoc(Math.min(1, a * 1.4));
            g.globalAlpha = p.die ? p.k : 1;
            g.fillStyle = p.c;
            g.beginPath();
            const P = p.pts.map((q) => [
                Math.cos(q[0]) * q[1] * e,
                Math.sin(q[0]) * q[1] * e,
              ]),
              n = P.length;
            g.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
            for (let i = 0; i < n; i++) {
              const A = P[i],
                B = P[(i + 1) % n];
              g.quadraticCurveTo(
                A[0],
                A[1],
                (A[0] + B[0]) / 2,
                (A[1] + B[1]) / 2,
              );
            }
            g.fill();
            p.sp.forEach((q) => {
              const c = Math.cos(q.a),
                s = Math.sin(q.a),
                L = q.l * b,
                W = q.w * e;
              g.beginPath();
              g.moveTo(c * p.R * 0.5 - s * W, s * p.R * 0.5 + c * W);
              g.lineTo(c * (p.R * 0.6 + L), s * (p.R * 0.6 + L));
              g.lineTo(c * p.R * 0.5 + s * W, s * p.R * 0.5 - c * W);
              g.fill();
            });
            p.dr.forEach((q) => {
              g.beginPath();
              g.arc(
                Math.cos(q.a) * q.d * b,
                Math.sin(q.a) * q.d * b,
                q.r * e,
                0,
                6.2832,
              );
              g.fill();
            });
            if (p.dp) {
              const L = p.dp.l * Math.min(1, Math.max(0, (age - 250) / 2600)),
                w = p.dp.w;
              if (L > 0) {
                g.beginPath();
                g.rect(p.dp.x - w / 2, 0, w, L);
                g.fill();
                g.beginPath();
                g.arc(p.dp.x, L, w * 0.75, 0, 6.2832);
                g.fill();
              }
            }
            g.globalAlpha = (p.die ? p.k : 1) * 0.22;
            g.fillStyle = "#fff";
            g.beginPath();
            g.ellipse(
              -p.R * 0.28,
              -p.R * 0.3,
              p.R * 0.22 * e,
              p.R * 0.12 * e,
              -0.6,
              0,
              6.2832,
            );
            g.fill();
          },
        },
        play: {
          n: 4.2e-5,
          sway: 0.3,
          mk: () => {
            const q = Math.random(),
              bl = q < 0.22;
            if (q > 0.65)
              return {
                conf: 1,
                s: rnd(4, 9),
                vx: rnd(-0.2, 0.2),
                vy: rnd(0.4, 1.1),
                vr: rnd(-0.05, 0.05),
                r: rnd(6),
                a: 0.85,
                c: pick([
                  "#ff6b6b",
                  "#ffd93d",
                  "#6bcB77",
                  "#4d96ff",
                  "#c77dff",
                  "#ff9f1c",
                ]),
                sh: Math.random() < 0.35,
              };
            return bl
              ? {
                  img: pick(BALLS),
                  bl,
                  s: rnd(36, 126),
                  vx: rnd(-0.15, 0.15),
                  vy: -rnd(0.12, 0.45),
                  vr: rnd(-0.004, 0.004),
                  r: rnd(6),
                  a: 1,
                }
              : {
                  img: pick(SHP),
                  bl,
                  s: rnd(18, 46),
                  vx: rnd(-0.2, 0.2),
                  vy: rnd(0.3, 0.9),
                  vr: rnd(-0.03, 0.03),
                  r: rnd(6),
                  a: rnd(0.75, 0.95),
                };
          },
          dr(p) {
            if (p.conf) {
              g.globalAlpha = p.a * p.k;
              g.fillStyle = p.c;
              g.beginPath();
              p.sh
                ? g.arc(0, 0, p.s / 2, 0, 6.28)
                : g.rect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
              g.fill();
              return;
            }
            const m = p.img,
              w = m.naturalWidth || m.width,
              h = m.naturalHeight || m.height;
            if (!w) return;
            g.globalAlpha = p.a * p.k;
            const z = p.bl ? 1.4 : 1;
            g.drawImage(
              m,
              (-p.s * z) / 2,
              (-p.s * z * h) / w / 2,
              p.s * z,
              (p.s * z * h) / w,
            );
          },
        },
        confetti: {
          n: 5e-5,
          sway: 0.5,
          mk: () => ({
            s: rnd(4, 9),
            vx: rnd(-0.2, 0.2),
            vy: rnd(0.4, 1.1),
            vr: rnd(-0.05, 0.05),
            r: rnd(6),
            c: pick([
              "#ff6b6b",
              "#ffd93d",
              "#6bcB77",
              "#4d96ff",
              "#c77dff",
              "#ff9f1c",
            ]),
            sh: Math.random() < 0.35,
          }),
          dr(p) {
            g.globalAlpha = 0.85 * p.k;
            g.fillStyle = p.c;
            g.beginPath();
            p.sh
              ? g.arc(0, 0, p.s / 2, 0, 6.28)
              : g.rect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
            g.fill();
          },
        },
        neon: {
          n: 3e-5,
          mk: () => ({
            len: rnd(30, 130),
            vx: 0,
            vy: -rnd(1, 3),
            c: pick(["#2ff3ff", "#2ff3ff", "#ff3df2"]),
          }),
          dr(p) {
            g.globalAlpha = 0.55 * p.k;
            g.strokeStyle = p.c;
            g.shadowColor = p.c;
            g.shadowBlur = 10;
            g.lineWidth = 1.5;
            g.beginPath();
            g.moveTo(0, 0);
            g.lineTo(0, p.len);
            g.stroke();
            g.shadowBlur = 0;
          },
        },
        bloom: {
          n: 2.8e-5,
          sway: 0.5,
          mk: () => {
            const fl = Math.random() < 0.35,
              L = fl ? SPR.f : SPR.p;
            return {
              img: pick(L),
              fl,
              s: fl ? rnd(48, 98) : rnd(16, 38),
              vx: rnd(-0.2, 0.1),
              vy: fl ? rnd(0.25, 0.6) : rnd(0.5, 1.2),
              vr: fl ? rnd(-0.006, 0.006) : rnd(-0.02, 0.02),
              r: rnd(6),
              a: fl ? rnd(0.8, 0.95) : rnd(0.55, 0.9),
            };
          },
          dr(p, t) {
            const m = p.img;
            if (!m.naturalWidth) return;
            const h = (p.s * m.naturalHeight) / m.naturalWidth;
            g.globalAlpha = p.a * p.k;
            if (!p.fl)
              g.scale(0.25 + 0.75 * Math.abs(Math.cos(t * 0.002 + p.ph)), 1);
            g.drawImage(m, -p.s / 2, -h / 2, p.s, h);
          },
        },
        petal: {
          n: 4e-5,
          sway: 0.6,
          mk: () => ({
            s: rnd(6, 14),
            vx: rnd(-0.2, 0.1),
            vy: rnd(0.3, 0.8),
            vr: rnd(-0.02, 0.02),
            r: rnd(6),
            c: pick(["#ffb7a0", "#ffcdbd", "#f59a8f", "#ffe0d4"]),
          }),
          dr(p) {
            g.globalAlpha = 0.7 * p.k;
            g.fillStyle = p.c;
            g.beginPath();
            g.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, 6.28);
            g.fill();
          },
        },
        blob: {
          n: 1.2e-5,
          mk: () => ({
            s: rnd(14, 50),
            vx: rnd(-0.25, 0.25),
            vy: rnd(-0.25, 0.25),
            sq: rnd(0.6, 1),
            c: pick(["#ff4f8b", "#2fd4c2", "#ffcf3f", "#4b7bff", "#ff7a2f"]),
          }),
          dr(p) {
            g.globalAlpha = 0.45 * p.k;
            g.fillStyle = p.c;
            g.beginPath();
            g.ellipse(0, 0, p.s, p.s * p.sq, 0, 0, 6.28);
            g.fill();
          },
        },
        orb: {
          n: 4e-6,
          mk: () => ({
            s: rnd(120, 260),
            vx: rnd(-0.2, 0.2),
            vy: rnd(-0.2, 0.2),
            c: pick(["#ff5fa2", "#ffb020", "#2fd4ff", "#8b5cff"]),
          }),
          dr(p) {
            const q = g.createRadialGradient(0, 0, 0, 0, 0, p.s);
            q.addColorStop(0, p.c + "77");
            q.addColorStop(1, p.c + "00");
            g.globalAlpha = p.k;
            g.fillStyle = q;
            g.beginPath();
            g.arc(0, 0, p.s, 0, 6.28);
            g.fill();
          },
        },
        square: {
          n: 1e-5,
          mk: () => ({
            s: rnd(14, 56),
            vx: 0,
            vy: -rnd(0.1, 0.3),
            vr: rnd(-0.004, 0.004),
            r: rnd(6),
          }),
          dr(p) {
            g.globalAlpha = 0.35 * p.k;
            g.strokeStyle = "#8fa6d9";
            g.lineWidth = 1;
            g.strokeRect(-p.s / 2, -p.s / 2, p.s, p.s);
          },
        },
      };
      function setFx(kind) {
        ps.forEach((p) => (p.die = true));
        spI = 0;
        ensure(FXASSET[kind]);
        const K = KINDS[kind];
        if (K.spawn) {
          K.spawn();
          return;
        }
        if (!K.n) return;
        const n = Math.max(4, Math.round(FW * FH * K.n));
        for (let i = 0; i < n; i++)
          ps.push(
            Object.assign(
              {
                kind,
                x: rnd(FW),
                y: rnd(FH),
                k: 0,
                t: 0,
                age: 0,
                die: false,
                ph: rnd(6.28),
                r: 0,
                vr: 0,
              },
              K.mk(),
            ),
          );
      }
      function fxSize() {
        const d = Math.min(2, devicePixelRatio || 1);
        FW = innerWidth;
        FH = innerHeight;
        cv.width = FW * d;
        cv.height = FH * d;
        g.setTransform(d, 0, 0, d, 0, 0);
      }
      let last = 0;
      function frame(t) {
        const dt = Math.min(1000, t - last || 16.7);
        last = t;
        const f = Math.min(
          3,
          dt / 16.7,
        ); /* real-time, so it looks the same at any frame rate */
        g.clearRect(0, 0, FW, FH);
        for (let i = ps.length - 1; i >= 0; i--) {
          const p = ps[i],
            K = KINDS[p.kind];
          p.age += dt;
          p.t = Math.max(0, Math.min(1, p.t + (p.die ? -dt : dt) / 1000));
          p.k =
            p.t *
            p.t *
            (3 - 2 * p.t); /* 1s eased fade, same length as the colour change */
          if (p.die && p.t === 0) {
            ps.splice(i, 1);
            continue;
          }
          p.x +=
            (p.vx + (K.sway ? Math.sin(t * 0.0012 + p.ph) * K.sway : 0)) * f;
          p.y += p.vy * f;
          p.r += p.vr * f;
          const m = (p.s || p.len || 40) * 2 + 40;
          if (p.x < -m) p.x = FW + m;
          else if (p.x > FW + m) p.x = -m;
          if (p.y < -m) p.y = FH + m;
          else if (p.y > FH + m) p.y = -m;
          g.save();
          g.translate(p.x, p.y);
          g.rotate(p.r);
          K.dr(p, t);
          g.restore();
        }
        g.globalAlpha = 1;
        requestAnimationFrame(frame);
      }
      addEventListener("resize", () => {
        layout();
        fxSize();
      });
      fxSize();
      layout();
      render(1);
      if (!still) requestAnimationFrame(frame);
    </script>
  </body>
</html>
